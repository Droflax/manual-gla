<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxy Quiz | El Manual del GLA</title>
    <meta name="description" content="Buscador de preguntas y respuestas del quiz del evento Foxy de Grand Line Adventures.">
    <link rel="icon" href="Img/ico.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/foxyquiz.min.css?v=2.1">
</head>

<body>
    <div class="backdrop" aria-hidden="true"></div>

    <header class="topbar">
        <a class="rot-bt" href="index.html" aria-label="Volver al inicio" title="Volver al inicio">
            <span class="material-symbols-sharp">home</span>
        </a>
        <h1 class="title">Foxy Quiz</h1>
        <div class="topbar-end" id="lang-slot"></div>
    </header>

    <main class="quiz">
        <div class="quiz-input-box">
            <span class="material-symbols-sharp search-icon" aria-hidden="true">search</span>
            <input class="quiz-input" type="search" placeholder="Escribe una parte de la pregunta…" aria-label="Buscar pregunta" autocomplete="off" spellcheck="false" autofocus>
            <button type="button" class="erase-bt" aria-label="Borrar búsqueda" title="Borrar búsqueda (Esc)">
                <span class="material-symbols-sharp">close</span>
            </button>
        </div>

        <div class="toolbar">
            <div class="chips" role="group" aria-label="Filtrar por respuesta">
                <button type="button" class="chip is-active" data-filter="all">Todas</button>
                <button type="button" class="chip chip-true" data-filter="true">Verdaderas</button>
                <button type="button" class="chip chip-false" data-filter="false">Falsas</button>
            </div>
            <span class="counter" id="counter" role="status" aria-live="polite"></span>
        </div>

        <div class="quiz-container" id="results" data-filter="all"></div>

        <p class="empty" id="empty" hidden>No hay preguntas que coincidan con tu búsqueda.</p>
    </main>

    <footer class="credit">
        Hecho por <a href="https://www.youtube.com/@Droflax/videos" target="_blank" rel="noopener">Droflax</a>
        <span class="credit-sep">·</span>
        <span class="credit-tip">Tip: presiona <kbd>/</kbd> para buscar</span>
    </footer>

    <script src="js/foxyquiz.min.js?v=1.3"></script>
</body>

</html>
